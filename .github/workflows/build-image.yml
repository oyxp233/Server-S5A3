name: Build and push S5A3 Server image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch in this repo to build
        required: true
        type: string
        default: patched
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DEFAULT_REF: patched
  IMAGE: ghcr.io/oyxp233/s5a3-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'patched' }}

      - name: Prepare Dockerfile
        run: |
          # 现有 Dockerfile 用了 BuildKit 的 --mount 语法，补 syntax 指令避免前端版本差异
          sed -i '1i # syntax=docker/dockerfile:1' deploy/docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/$(basename "$IMAGE")/visibility" \
            -f visibility=public
